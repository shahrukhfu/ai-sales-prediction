<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Background Glow Animation */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    .ambient-glow {
      transform-origin: 600px 225px;
      animation: pulseGlow 10s ease-in-out infinite;
    }

    /* Grid Fade Animation */
    .grid-lines {
      stroke: #334155;
      stroke-opacity: 0.3;
      stroke-dasharray: 4,4;
    }

    /* Regression Curves Animations */
    @keyframes drawPath {
      to {
        stroke-dashoffset: 0;
      }
    }
    .linear-fit {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawPath 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .poly-fit {
      stroke-dasharray: 1500;
      stroke-dashoffset: 1500;
      animation: drawPath 3.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    }

    /* Data Points Animation */
    @keyframes scatterShow {
      0% { opacity: 0; transform: scale(0); }
      70% { opacity: 0.8; transform: scale(1.2); }
      100% { opacity: 0.7; transform: scale(1); }
    }
    .data-point {
      transform-origin: attr(cx) attr(cy);
      opacity: 0;
      animation: scatterShow 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Sequential delays for data points */
    .dp-1  { animation-delay: 0.1s; transform-origin: 200px 320px; }
    .dp-2  { animation-delay: 0.2s; transform-origin: 300px 280px; }
    .dp-3  { animation-delay: 0.3s; transform-origin: 400px 300px; }
    .dp-4  { animation-delay: 0.4s; transform-origin: 500px 230px; }
    .dp-5  { animation-delay: 0.5s; transform-origin: 600px 180px; }
    .dp-6  { animation-delay: 0.6s; transform-origin: 700px 210px; }
    .dp-7  { animation-delay: 0.7s; transform-origin: 800px 140px; }
    .dp-8  { animation-delay: 0.8s; transform-origin: 900px 110px; }
    .dp-9  { animation-delay: 0.9s; transform-origin: 1000px 120px; }
    .dp-10 { animation-delay: 1.0s; transform-origin: 1100px 80px; }

    /* Float / Pulse Info Panel */
    @keyframes floatPanel {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animated-panel {
      animation: floatPanel 6s ease-in-out infinite;
    }

    /* Text Typing / Draw Effect */
    @keyframes fadeInText {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .fade-in-text {
      opacity: 0;
      animation: fadeInText 1s ease-out forwards;
    }
    .text-delay-1 { animation-delay: 1.2s; }
    .text-delay-2 { animation-delay: 1.6s; }
    .text-delay-3 { animation-delay: 2.0s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="450" fill="url(#bgGrad)" />
  
  <!-- Ambient Glow in the center -->
  <circle cx="600" cy="225" r="350" fill="url(#glowGrad)" class="ambient-glow" />

  <!-- Grid System -->
  <g>
    <!-- Horizontal Grid Lines -->
    <line x1="100" y1="80" x2="1150" y2="80" class="grid-lines" />
    <line x1="100" y1="150" x2="1150" y2="150" class="grid-lines" />
    <line x1="100" y1="220" x2="1150" y2="220" class="grid-lines" />
    <line x1="100" y1="290" x2="1150" y2="290" class="grid-lines" />
    <line x1="100" y1="360" x2="1150" y2="360" class="grid-lines" />
    
    <!-- Vertical Grid Lines -->
    <line x1="200" y1="50" x2="200" y2="380" class="grid-lines" />
    <line x1="350" y1="50" x2="350" y2="380" class="grid-lines" />
    <line x1="500" y1="50" x2="500" y2="380" class="grid-lines" />
    <line x1="650" y1="50" x2="650" y2="380" class="grid-lines" />
    <line x1="800" y1="50" x2="800" y2="380" class="grid-lines" />
    <line x1="950" y1="50" x2="950" y2="380" class="grid-lines" />
    <line x1="1100" y1="50" x2="1100" y2="380" class="grid-lines" />
  </g>

  <!-- Axes -->
  <line x1="100" y1="380" x2="1150" y2="380" stroke="#475569" stroke-width="2" />
  <line x1="100" y1="50" x2="100" y2="380" stroke="#475569" stroke-width="2" />

  <!-- Scatter Data Points -->
  <g fill="#94a3b8">
    <circle cx="200" cy="320" r="7" class="data-point dp-1" fill="#64748b" />
    <circle cx="300" cy="280" r="7" class="data-point dp-2" fill="#64748b" />
    <circle cx="400" cy="300" r="7" class="data-point dp-3" fill="#64748b" />
    <circle cx="500" cy="230" r="7" class="data-point dp-4" fill="#64748b" />
    <circle cx="600" cy="180" r="7" class="data-point dp-5" fill="#64748b" />
    <circle cx="700" cy="210" r="7" class="data-point dp-6" fill="#64748b" />
    <circle cx="800" cy="140" r="7" class="data-point dp-7" fill="#64748b" />
    <circle cx="900" cy="110" r="7" class="data-point dp-8" fill="#64748b" />
    <circle cx="1000" cy="120" r="7" class="data-point dp-9" fill="#64748b" />
    <circle cx="1100" cy="80" r="7" class="data-point dp-10" fill="#64748b" />
  </g>

  <!-- Regression Lines -->
  
  <!-- Simple Linear Regression (Dashed blue line) -->
  <path d="M 100 350 L 1150 78" 
        fill="none" 
        stroke="url(#lineGrad)" 
        stroke-width="3" 
        stroke-dasharray="8,6"
        opacity="0.6"
        class="linear-fit" />

  <!-- Polynomial Regression Degree 2 (Emerald curving line) -->
  <path d="M 100 375 Q 400 240 700 170 T 1150 90" 
        fill="none" 
        stroke="url(#polyGrad)" 
        stroke-width="5" 
        filter="url(#glow)"
        class="poly-fit" />

  <!-- Mathematical Annotations & Floating Panels -->
  <g class="animated-panel">
    <!-- Panel Background -->
    <rect x="150" y="70" width="320" height="95" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Model Metrics Text -->
    <text x="175" y="100" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Polynomial Fit (Degree = 2)</text>
    <text x="175" y="122" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="bold">R² Coefficient: 0.9868</text>
    <text x="175" y="140" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">Diminishing Returns: Active</text>
  </g>

  <!-- Overlay UI elements -->
  <text x="100" y="415" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">INDEPENDENT VARIABLE (X)</text>
  <text x="50" y="240" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" transform="rotate(-90 50 240)" text-anchor="middle">DEPENDENT TARGET (Y)</text>

  <!-- Brand Title / Headers -->
  <g class="fade-in-text text-delay-1">
    <text x="750" y="300" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="1">REGRESSION SUITE</text>
  </g>
  <g class="fade-in-text text-delay-2">
    <text x="750" y="330" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Ordinary Least Squares &amp; Polynomial Modeling</text>
  </g>
  <g class="fade-in-text text-delay-3">
    <rect x="750" y="350" width="140" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="820" y="366" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INTERACTIVE RUNTIME</text>
  </g>
</svg>
